<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrar flor</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
	<div class="row justify-content-center">
		<div class="col-md-7 col-lg-6">
			<div class="card shadow-sm">
				<div class="card-header bg-success text-white">
					<h1 class="h4 mb-0">Registrar flor</h1>
				</div>
				<div class="card-body">
					<form th:action="@{/flores/guardar}" th:object="${flor}" method="post">
						<div class="mb-3">
							<label for="nombre" class="form-label">Nombre</label>
							<input type="text" th:field="*{nombreArreglo}" id="nombre" class="form-control" required>
						</div>
						<div class="mb-3">
							<label for="color" class="form-label">Color</label>
							<input type="text" th:field="*{color}" id="color" class="form-control" required>
						</div>
						<div class="mb-3">
							<label for="precio" class="form-label">Precio</label>
							<input type="number" th:field="*{precio}" id="precio" class="form-control" min="0" step="0.01" required>
						</div>
						
						<div class="d-flex justify-content-end gap-2">
							<a th:href="@{/flores}" class="btn btn-secondary">Cancelar</a>
							<button type="submit" class="btn btn-success">Guardar</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>
