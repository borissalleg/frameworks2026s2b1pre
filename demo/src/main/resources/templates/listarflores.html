<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Listado de flores</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

	<main class="container py-4">
		<h1 class="mb-4">Listado de flores</h1>

		<div class="row g-4">
			<div class="col-md-4" th:each="flor : ${flores}">
				<article class="card h-100 shadow-sm">
					<div class="card-body">
						<h2 class="card-title h5" th:text="${flor.nombreArreglo}">Nombre de la flor</h2>
						<p class="card-text mb-1">
							<strong>Color:</strong>
							<span th:text="${flor.color}">Color</span>
						</p>
						<p class="card-text">
							<strong>Precio:</strong>
							<span th:text="${flor.precio}">0.00</span>
						</p>
					</div>
				</article>
			</div>

			<div class="col-12" th:if="${#lists.isEmpty(flores)}">
				<div class="alert alert-info">No hay flores disponibles.</div>
			</div>
		</div>
	</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
